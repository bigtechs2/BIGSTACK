<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>BIGSTACK</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

    <!-- ─── Background floating icons ─────────────── -->
    <div id="bg-icons"></div>

    <!-- ─── Header ─────────────────────────────────── -->
    <header id="app-header">
        <div class="logo">
            <span class="logo-mark">◈</span>
            <span class="logo-text">BIGSTACK</span>
        </div>
        <div class="header-actions">
            <div class="balance-chip" id="header-balance">0</div>
        </div>
    </header>

    <!-- ─── Main content ───────────────────────────── -->
    <main id="app-main">
        <!-- Pages are rendered here -->
    </main>

    <!-- ─── Bottom navigation ──────────────────────── -->
    <nav id="app-nav">
        <button data-route="home" class="nav-item active">
            <span class="nav-icon">◈</span>
            <span class="nav-label">Home</span>
        </button>
        <button data-route="downloader" class="nav-item">
            <span class="nav-icon">◇</span>
            <span class="nav-label">Download</span>
        </button>
        <button data-route="search" class="nav-item">
            <span class="nav-icon">◉</span>
            <span class="nav-label">Search</span>
        </button>
        <button data-route="profile" class="nav-item">
            <span class="nav-icon">★</span>
            <span class="nav-label">Profile</span>
        </button>
    </nav>

    <!-- ─── Loading overlay ────────────────────────── -->
    <div id="loading-overlay" class="hidden">
        <div class="loader"></div>
        <div class="loader-text">Loading...</div>
    </div>

    <!-- ─── Toast messages ─────────────────────────── -->
    <div id="toast-container"></div>

    <!-- ─── Scripts ────────────────────────────────── -->
    <script src="/js/telegram.js"></script>
    <script src="/js/state.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/router.js"></script>

    <!-- Pages -->
    <script src="/js/pages/home.js"></script>
    <script src="/js/pages/downloader.js"></script>
    <script src="/js/pages/search.js"></script>
    <script src="/js/pages/player.js"></script>
    <script src="/js/pages/profile.js"></script>
    <script src="/js/pages/daily.js"></script>
    <script src="/js/pages/store.js"></script>
    <script src="/js/pages/settings.js"></script>

    <!-- Entry point ⏤ must be last -->
    <script src="/js/app.js"></script>

</body>
</html>

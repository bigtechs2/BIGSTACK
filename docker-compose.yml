version: "3.9"

services:

    bigstack:
        build: .
        container_name: bigstack-bot
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "3000:3000"
        volumes:
            - ./downloads:/app/downloads
            - ./logs:/app/logs
            - ./config.json:/app/config.json
        networks:
            - bigstack-net

networks:
    bigstack-net:
        driver: bridge